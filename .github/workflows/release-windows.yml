name: Release (Windows)

on:
  # v1.0.0 のようなタグを push すると、ビルドして GitHub Releases に公開する
  push:
    tags:
      - 'v*'
  # Actions 画面から手動実行すると、ビルドだけ行い成果物（Artifacts）として保存する
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ ($GITHUB_REF_NAME) と package.json の version ($PKG_VERSION) が一致しません"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package installer
        # 公開は下の gh-release ステップで行うため、electron-builder 自身の publish は無効化
        run: pnpm exec electron-builder --win --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mondai-windows
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true
